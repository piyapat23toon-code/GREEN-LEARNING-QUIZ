    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2d6a4f;
            --secondary: #40916c;
            --light: #d8f3dc;
            --bg: #f4fcf5;
            --correct: #c8e6c9;
            --correct-border: #4caf50;
            --wrong: #ffcdd2;
            --wrong-border: #f44336;
        }
        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg);
            color: #333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
            flex: 1;
            width: 100%;
            box-sizing: border-box;
        }
        .question-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-left: 5px solid var(--secondary);
        }
        .question-text {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--primary);
        }
        .option {
            display: block;
            background: var(--light);
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s;
        }
        .option:hover {
            background: #b7e4c7;
        }
        .option input {
            margin-right: 10px;
        }
        /* State Classes */
        .correct-ans {
            background: var(--correct) !important;
            border-color: var(--correct-border) !important;
            color: #1b5e20;
            font-weight: bold;
        }
        .wrong-ans {
            background: var(--wrong) !important;
            border-color: var(--wrong-border) !important;
            color: #b71c1c;
        }
        .disabled {
            pointer-events: none;
            opacity: 0.8;
        }
        #score-display {
            font-size: 1.5em;
            font-weight: bold;
            color: #ffd166;
        }
        
        /* สไตล์สำหรับส่วนท้ายเว็บ (Footer) */
        footer {
            background: var(--primary);
            color: var(--light);
            text-align: center;
            padding: 25px 20px;
            margin-top: 40px;
            border-top: 4px solid var(--secondary);
        }
        footer p {
            margin: 5px 0;
            font-weight: 300;
            letter-spacing: 1px;
        }
        footer strong {
            font-weight: 600;
            font-size: 1.1em;
        }
    </style>
</head>

    // Build Quiz UI
    data.forEach((item, qIndex) => {
        const questionText = item[0];
        const correctIndex = item[1];
        
        let cardHTML = `<div class="question-card" id="qcard-${qIndex}">`;
        cardHTML += `<div class="question-text">ข้อที่ ${qIndex + 1}: ${questionText}</div>`;
        
        for (let i = 2; i < item.length; i++) {
            const optIndex = i - 2;
            const isCorrect = (optIndex === correctIndex);
            
            cardHTML += `
                <label class="option" id="opt-${qIndex}-${optIndex}" onclick="checkAnswer(${qIndex}, ${optIndex}, ${correctIndex})">
                    <input type="radio" name="q${qIndex}" value="${optIndex}">
                    ${item[i]}
                </label>
            `;
        }
        cardHTML += `</div>`;
        container.innerHTML += cardHTML;
    });

    // Handle Answer Checking
    window.checkAnswer = function(qIndex, selectedIndex, correctIndex) {
        const card = document.getElementById(`qcard-${qIndex}`);
        
        // ถ้าตอบข้อนี้ไปแล้ว ให้ข้าม (ป้องกันการปั๊มคะแนน)
        if (card.classList.contains('answered')) return;
        card.classList.add('answered');

        // หา Option ที่ผู้ใช้เลือก และ Option ที่ถูก
        const selectedOpt = document.getElementById(`opt-${qIndex}-${selectedIndex}`);
        const correctOpt = document.getElementById(`opt-${qIndex}-${correctIndex}`);

        // ปิดการคลิกตัวเลือกอื่นในข้อนี้
        const options = card.querySelectorAll('.option');
        options.forEach(opt => opt.classList.add('disabled'));

        if (selectedIndex === correctIndex) {
            // ตอบถูก
            selectedOpt.classList.add('correct-ans');
            score++;
        } else {
            // ตอบผิด
            selectedOpt.classList.add('wrong-ans');
            correctOpt.classList.add('correct-ans'); // ไฮไลท์เฉลยข้อที่ถูกให้ด้วย
        }
        
        // อัปเดตคะแนน
        scoreDisplay.innerText = score;
    };
